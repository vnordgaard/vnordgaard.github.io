<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Omfordelingsspillet</title>
<style>
  :root { --coin: #e3b100; --coin-edge: #8a6a00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px; }
  .sub { margin: 0 0 24px; }
  button {
    font: inherit; color: #000; background: #fff;
    border: 1.5px solid #000; padding: 10px 18px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #000; color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  .primary { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

  #start p { max-width: 46ch; }
  #game { display: none; }
  .topline { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .round { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; }

  .board { position: relative; }
  .bag { display: flex; flex-direction: column; align-items: center; margin: 8px 0 20px; }
  .bag svg { width: 64px; height: 64px; }
  .bag .label { font-size: .85rem; font-variant-numeric: tabular-nums; min-height: 1.5em; }

  .row {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center;
    padding: 10px 0; border-top: 1px solid #000;
  }
  .row:last-child { border-bottom: 1px solid #000; }
  .row svg { width: 36px; height: 60px; display: block; }
  .name { font-weight: 400; }
  .row.player .name { font-weight: 700; }
  .bar { height: 6px; background: #eee; margin-top: 6px; }
  .bar > div { height: 100%; background: #000; width: 0; transition: width .15s linear; }
  .status { font-size: .85rem; min-height: 1.3em; margin-top: 4px; }
  .total { font-size: .8rem; color: #555; }
  .coins { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 4ch; }
  .coins small { display: block; font-size: .7rem; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; }
  .row.winner .coins::before { content: "★ "; }

  .panel { margin-top: 24px; min-height: 120px; }
  .panel p { margin: 0 0 12px; }
  .choices { display: grid; gap: 8px; }
  .choices button { text-align: left; }
  .choices small { display: block; font-size: .8rem; opacity: .75; }
  .rule { font-size: .8rem; margin-top: 10px; }

  .coin {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: var(--coin); border: 1.5px solid var(--coin-edge);
    pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<div class="wrap">

  <section id="start">
    <h1>Omfordelingsspillet</h1>
    <p class="sub">The redistribution game</p>
    <p>You play against three computer players. Each round, 1,000 coins are handed out at random.
       Then everyone votes on how the coins should be redistributed.</p>
    <p>
      <button class="primary" id="startBtn">Start game</button>
    </p>
  </section>

  <section id="game">
    <div class="topline">
      <h1>Omfordelingsspillet</h1>
      <span class="round" id="roundLabel">Round 1</span>
    </div>

    <div class="board" id="board">
      <div class="bag">
        <svg viewBox="0 0 64 64" id="bagIcon" aria-hidden="true">
          <path d="M24 14 L40 14 L35 22 L29 22 Z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <path d="M29 22 C14 30 8 44 12 52 C15 58 49 58 52 52 C56 44 50 30 35 22 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <line x1="27" y1="22" x2="37" y2="22" stroke="#000" stroke-width="3"/>
          <text x="32" y="48" text-anchor="middle" font-size="16" font-weight="700" font-family="Helvetica, Arial, sans-serif">$</text>
        </svg>
        <div class="label" id="bagLabel"></div>
      </div>
      <div id="rows"></div>
    </div>

    <div class="panel" id="panel"></div>
  </section>

</div>

<script>
(function () {
  // ---------- settings ----------
  var NAMES = ['You', 'NPC 1', 'NPC 2', 'NPC 3'];
  var N = NAMES.length;
  var TOTAL = 1000;

  // Tax rate goes linearly from 10% at 1 coin to 90% at 1000 coins (progressive), or the reverse (regressive).
  function progRate(c) { return c <= 0 ? 0 : 0.1 + 0.8 * (Math.min(c, TOTAL) - 1) / (TOTAL - 1); }
  function regRate(c)  { return c <= 0 ? 0 : 0.9 - 0.8 * (Math.min(c, TOTAL) - 1) / (TOTAL - 1); }

  var POLICIES = {
    prog: { label: 'Policy 1: Progressive', short: 'Progressive', note: 'Tax 10% at 1 coin, rising to 90% at 1,000 coins', rate: progRate },
    reg:  { label: 'Policy 2: Regressive',  short: 'Regressive',  note: 'Tax 90% at 1 coin, falling to 10% at 1,000 coins', rate: regRate },
    none: { label: 'No redistribution',     short: 'No redistribution', note: 'Everyone keeps what they got', rate: function () { return 0; } }
  };

  // ---------- state ----------
  var round = 0;
  var coins = [];                    // coins dealt this round
  var shown = [];                    // what is currently displayed
  var totals = new Array(N).fill(0);
  var wins = new Array(N).fill(0);
  var bagCount = 0;

  // ---------- helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
  var fmt = function (n) { return n.toLocaleString('en-US'); };

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // Random split of TOTAL coins over N players (uniform over all splits)
  function deal() {
    var w = [];
    for (var i = 0; i < N; i++) w.push(-Math.log(1 - Math.random()));
    var s = sum(w);
    var out = w.map(function (x) { return Math.floor(x / s * TOTAL); });
    var rest = TOTAL - sum(out);
    shuffle([...Array(N).keys()]).slice(0, rest).forEach(function (i) { out[i]++; });
    return out;
  }

  // Taxes go into a pot, the pot is split equally among all players.
  function outcome(c, key, exact) {
    var rate = POLICIES[key].rate;
    var taxes = c.map(function (x) { return Math.round(x * rate(x)); });
    var pot = sum(taxes);
    var shares;
    if (exact) {
      var base = Math.floor(pot / N), rem = pot - base * N;
      shares = new Array(N).fill(base);
      shuffle([...Array(N).keys()]).slice(0, rem).forEach(function (i) { shares[i]++; });
    } else {
      shares = new Array(N).fill(pot / N);
    }
    var final = c.map(function (x, i) { return x - taxes[i] + shares[i]; });
    return { taxes: taxes, pot: pot, shares: shares, final: final };
  }

  // NPCs vote for whatever leaves them with the most coins (tie: no redistribution).
  function npcVote(i) {
    var best = 'none', bestVal = outcome(coins, 'none').final[i];
    ['prog', 'reg'].forEach(function (k) {
      var v = outcome(coins, k).final[i];
      if (v > bestVal + 1e-9) { best = k; bestVal = v; }
    });
    return best;
  }

  // ---------- rendering ----------
  function stick(filled) {
    return '<svg viewBox="0 0 36 60" aria-hidden="true">' +
      '<circle cx="18" cy="9" r="7" fill="' + (filled ? '#000' : '#fff') + '" stroke="#000" stroke-width="2"/>' +
      '<line x1="18" y1="16" x2="18" y2="38" stroke="#000" stroke-width="2"/>' +
      '<line x1="6" y1="25" x2="30" y2="25" stroke="#000" stroke-width="2"/>' +
      '<line x1="18" y1="38" x2="8" y2="57" stroke="#000" stroke-width="2"/>' +
      '<line x1="18" y1="38" x2="28" y2="57" stroke="#000" stroke-width="2"/>' +
      '</svg>';
  }

  function buildRows() {
    $('rows').innerHTML = NAMES.map(function (n, i) {
      return '<div class="row' + (i === 0 ? ' player' : '') + '" id="row' + i + '">' +
        '<div class="fig" id="fig' + i + '">' + stick(i === 0) + '</div>' +
        '<div><div class="name">' + n + (i === 0 ? ' (player)' : '') + '</div>' +
          '<div class="bar"><div id="bar' + i + '"></div></div>' +
          '<div class="status" id="status' + i + '"></div>' +
          '<div class="total" id="total' + i + '"></div></div>' +
        '<div class="coins"><span id="coins' + i + '">0</span><small>coins</small></div>' +
      '</div>';
    }).join('');
  }

  function draw() {
    for (var i = 0; i < N; i++) {
      $('coins' + i).textContent = fmt(Math.round(shown[i]));
      $('bar' + i).style.width = Math.max(0, Math.min(100, shown[i] / TOTAL * 100)) + '%';
    }
  }

  function setBag(text) { $('bagLabel').textContent = text; }
  function setStatus(i, text) { $('status' + i).textContent = text; }
  function panel(html) { $('panel').innerHTML = html; }

  // ---------- coin animation ----------
  function center(el) {
    var b = $('board').getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2 };
  }

  // Fly `amount` coins from one element to another as a few visual coins.
  function flyCoins(fromEl, toEl, amount, startDelay, onDepart, onArrive) {
    if (amount <= 0) return Promise.resolve();
    var k = Math.max(1, Math.min(18, Math.round(amount / 40)));
    var chunks = [], base = Math.floor(amount / k), rem = amount - base * k;
    for (var j = 0; j < k; j++) chunks.push(base + (j < rem ? 1 : 0));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dur = reduce ? 0 : 650;

    return Promise.all(chunks.map(function (chunk, j) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          var a = center(fromEl), b = center(toEl);
          onDepart && onDepart(chunk);
          if (reduce) { onArrive && onArrive(chunk); return resolve(); }
          var c = document.createElement('div');
          c.className = 'coin';
          c.style.left = (a.x - 7) + 'px';
          c.style.top = (a.y - 7) + 'px';
          $('board').appendChild(c);
          var jitter = (Math.random() - 0.5) * 16;
          var anim = c.animate([
            { transform: 'translate(0,0)' },
            { transform: 'translate(' + ((b.x - a.x) / 2 + jitter) + 'px,' + ((b.y - a.y) / 2) + 'px)', offset: 0.5 },
            { transform: 'translate(' + (b.x - a.x) + 'px,' + (b.y - a.y) + 'px)' }
          ], { duration: dur, easing: 'ease-in-out' });
          anim.onfinish = function () { c.remove(); onArrive && onArrive(chunk); resolve(); };
        }, startDelay + j * 70);
      });
    }));
  }

  // ---------- game flow ----------
  async function startRound() {
    round++;
    $('roundLabel').textContent = 'Round ' + round;
    coins = deal();
    shown = new Array(N).fill(0);
    for (var i = 0; i < N; i++) { setStatus(i, ''); $('row' + i).classList.remove('winner'); }
    draw();
    panel('<p>Handing out 1,000 coins at random…</p>');

    bagCount = TOTAL;
    setBag(fmt(bagCount) + ' coins');
    var bag = $('bagIcon');
    await Promise.all(coins.map(function (amt, i) {
      return flyCoins(bag, $('fig' + i), amt, i * 180,
        function (ch) { bagCount -= ch; setBag(fmt(bagCount) + ' coins'); },
        function (ch) { shown[i] += ch; draw(); });
    }));
    shown = coins.slice(); draw();
    setBag('');
    askVote();
  }

  function askVote() {
    var keys = ['prog', 'reg', 'none'];
    panel(
      '<p><strong>How should the coins be redistributed?</strong></p>' +
      '<div class="choices">' + keys.map(function (k) {
        return '<button data-k="' + k + '">' + POLICIES[k].label + '<small>' + POLICIES[k].note + '</small></button>';
      }).join('') + '</div>' +
      '<p class="rule">All taxes go into the bag and are split equally between the four players. ' +
      'Everyone votes; the policy with the most votes wins. A tie means no redistribution.</p>'
    );
    $('panel').querySelectorAll('button[data-k]').forEach(function (b) {
      b.addEventListener('click', function () { vote(b.getAttribute('data-k')); });
    });
  }

  async function vote(playerChoice) {
    panel('<p>Counting votes…</p>');
    var votes = [playerChoice];
    for (var i = 1; i < N; i++) votes.push(npcVote(i));

    for (var i = 0; i < N; i++) { setStatus(i, 'Votes: ' + POLICIES[votes[i]].short); await sleep(350); }

    var count = { prog: 0, reg: 0, none: 0 };
    votes.forEach(function (v) { count[v]++; });
    var max = Math.max(count.prog, count.reg, count.none);
    var top = Object.keys(count).filter(function (k) { return count[k] === max; });
    var winner = top.length === 1 ? top[0] : 'none';
    var tieNote = top.length > 1 ? ' (tie, so no redistribution)' : '';

    panel('<p><strong>Result: ' + POLICIES[winner].short + '</strong>' + tieNote +
      ' — Progressive ' + count.prog + ', Regressive ' + count.reg + ', None ' + count.none + '</p>');
    await sleep(900);

    var res = outcome(coins, winner, true);

    if (winner !== 'none') {
      // taxes into the bag
      var pot = 0; setBag('Pot: 0');
      var bag = $('bagIcon');
      await Promise.all(res.taxes.map(function (t, i) {
        return flyCoins($('fig' + i), bag, t, i * 180,
          function (ch) { shown[i] -= ch; draw(); },
          function (ch) { pot += ch; setBag('Pot: ' + fmt(pot)); });
      }));
      for (var i = 0; i < N; i++) setStatus(i, 'Votes: ' + POLICIES[votes[i]].short + ' · paid ' + fmt(res.taxes[i]) + ' in tax');
      await sleep(500);
      // pot split equally
      await Promise.all(res.shares.map(function (s, i) {
        return flyCoins(bag, $('fig' + i), s, i * 180,
          function (ch) { pot -= ch; setBag('Pot: ' + fmt(pot)); },
          function (ch) { shown[i] += ch; draw(); });
      }));
      setBag('');
      for (var i = 0; i < N; i++) {
        var net = res.final[i] - coins[i];
        setStatus(i, 'Votes: ' + POLICIES[votes[i]].short + ' · paid ' + fmt(res.taxes[i]) +
          ', got ' + fmt(res.shares[i]) + ' back (' + (net >= 0 ? '+' : '−') + fmt(Math.abs(net)) + ')');
      }
    }
    shown = res.final.slice(); draw();
    endRound(res.final);
  }

  function endRound(final) {
    var best = Math.max.apply(null, final);
    var leaders = [];
    for (var i = 0; i < N; i++) {
      totals[i] += final[i];
      if (final[i] === best) { wins[i]++; leaders.push(NAMES[i]); $('row' + i).classList.add('winner'); }
    }
    drawTotals();
    var who = leaders.length === 1
      ? (leaders[0] === 'You' ? 'You have' : leaders[0] + ' has')
      : leaders.join(' and ') + ' share';
    panel('<p><strong>' + who + ' the most coins this round (' + fmt(best) + ').</strong></p>' +
      '<p><button class="primary" id="againBtn">Keep playing</button></p>');
    $('againBtn').addEventListener('click', startRound);
  }

  function drawTotals() {
    for (var i = 0; i < N; i++) {
      $('total' + i).textContent = 'Total after ' + round + (round === 1 ? ' round: ' : ' rounds: ') +
        fmt(totals[i]) + ' coins · most coins ' + wins[i] + '×';
    }
  }

  $('startBtn').addEventListener('click', function () {
    $('start').style.display = 'none';
    $('game').style.display = 'block';
    buildRows();
    startRound();
  });
})();
</script>
</body>
</html>
